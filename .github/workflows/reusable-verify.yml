name: Reusable Verify

# License gate + build/test/osgiTest/perfTest. No credentials.
# Runs for every branch and PR via the calling repos' build/snapshot/release workflows.
on:
  workflow_call:
    inputs:
      java-versions:
        description: 'JSON array of JDKs to test against.'
        type: string
        default: '["21","25"]'
      run-perf-tests:
        description: 'Run the perfTest task as well.'
        type: boolean
        default: true
      extra-gradle-tasks:
        description: 'Additional Gradle tasks appended to the build invocation (e.g. bndrun resolve/export checks).'
        type: string
        default: ''
      gradle-parallel:
        description: 'Run Gradle with org.gradle.parallel. bnd workspaces with resolve/export tasks may need false.'
        type: boolean
        default: true

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=${{ inputs.gradle-parallel }}

defaults:
  run:
    shell: bash

jobs:
  # 1) License headers gate everything else.
  license:
    name: License check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check License Header
        uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) Build + test — only if the license check passed.
  build:
    name: Gradle Build (Java ${{ matrix.java-version }})
    needs: license
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ${{ fromJSON(inputs.java-versions) }}
      fail-fast: false
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          cache: "gradle"
          java-version: ${{ matrix.java-version }}
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Gradle version
        run: ./gradlew --no-daemon --version
      - name: Build with Gradle
        env:
          # Passed via env (not inline expression) so the input never gets
          # interpolated into the shell script; word splitting is intended.
          EXTRA_GRADLE_TASKS: ${{ inputs.extra-gradle-tasks }}
        run: ./gradlew clean build testOSGi $EXTRA_GRADLE_TASKS --info
      - name: Run Performance Tests
        if: inputs.run-perf-tests
        run: ./gradlew perfTest --info
      - name: Publish Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: |
            **/build/test-results/**/TEST-*.xml
            **/generated/test-reports/**/TEST-*.xml
