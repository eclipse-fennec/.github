name: Reusable Verify

# License gate + build/test/osgiTest/perfTest. No credentials.
# Runs for every branch and PR via the calling repos' build/snapshot/release workflows.
# Each JDK leg uploads its JUnit XML as `test-results-java-<version>` and renders it
# as a job summary; reusable-test-report.yml turns those artifacts into check runs.
on:
  workflow_call:
    inputs:
      java-versions:
        description: 'JSON array of JDKs to test against.'
        type: string
        default: '["21","25"]'
      run-perf-tests:
        description: 'Run the perfTest task as well.'
        type: boolean
        default: true
      extra-gradle-tasks:
        description: 'Additional Gradle tasks appended to the build invocation (e.g. bndrun resolve/export checks).'
        type: string
        default: ''
      gradle-parallel:
        description: 'Run Gradle with org.gradle.parallel. bnd workspaces with resolve/export tasks may need false.'
        type: boolean
        default: true

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=${{ inputs.gradle-parallel }}

defaults:
  run:
    shell: bash

jobs:
  # 1) License headers gate everything else.
  license:
    name: License check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check License Header
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2) Build + test — only if the license check passed.
  build:
    name: Gradle Build (Java ${{ matrix.java-version }})
    needs: license
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ${{ fromJSON(inputs.java-versions) }}
      fail-fast: false
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          cache: "gradle"
          java-version: ${{ matrix.java-version }}
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Gradle version
        run: ./gradlew --no-daemon --version
      - name: Build with Gradle
        env:
          # Passed via env (not inline expression) so the input never gets
          # interpolated into the shell script; word splitting is intended.
          EXTRA_GRADLE_TASKS: ${{ inputs.extra-gradle-tasks }}
        run: ./gradlew clean build testOSGi $EXTRA_GRADLE_TASKS --info
      - name: Run Performance Tests
        if: inputs.run-perf-tests
        run: ./gradlew perfTest --info
      - name: Publish Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-java-${{ matrix.java-version }}
          # bnd's Gradle plugin writes both the plain and the OSGi reports to
          # <project>/generated/test-reports/{test,testOSGi}/; the build/ line
          # only matters for a plain Gradle subproject. Both stay: an unmatched
          # glob costs nothing, a missing one silently drops reports.
          path: |
            **/build/test-results/**/TEST-*.xml
            **/generated/test-reports/**/TEST-*.xml
      - name: Look for test reports
        # Only render when there is something to render. No XML means the build
        # died before it ran a test (compile error) - that run is already red,
        # and a second failure from the renderer would only hide the first.
        id: junit
        if: always()
        run: |
          if find . -path '*/TEST-*.xml' \( -path '*/build/test-results/*' -o -path '*/generated/test-reports/*' \) -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No JUnit XML found - skipping the test report."
          fi
      - name: Render test results
        # Job summary plus inline annotations, no check run: a check run needs
        # `checks: write`, which the caller would have to grant, and a called
        # workflow cannot request a permission conditionally. Consumers that want
        # the check run call reusable-test-report.yml after this workflow.
        if: always() && steps.junit.outputs.found == 'true'
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          # One pattern, not one per directory: every line of report_paths is
          # rendered as its own result, and the build/ one is empty in a bnd
          # workspace. The upload above is what fixes the directories.
          report_paths: '**/TEST-*.xml'
          annotate_only: true
          job_summary: true
          detailed_summary: true
          include_passed: false
          # A green run of a large suite has a handful of non-passing entries
          # (skipped tests) among hundreds of suites; without this the summary
          # table carries one empty row per suite.
          include_empty_in_summary: false
          # The Gradle step is the gate; this step only renders.
          fail_on_failure: false
          # But DO fail when the glob matched nothing although XML exists: that
          # means the layout changed and the report would be silently empty.
          require_tests: true
