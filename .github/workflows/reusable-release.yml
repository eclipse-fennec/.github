name: Reusable Release

# Credential-scoped publish step. Only this workflow receives the Sonatype/GPG secrets.
# Publishes with a single JDK (21). do-release toggles Central (true) vs Snapshot (false).
on:
  workflow_call:
    inputs:
      do-release:
        description: 'true => Maven Central release; false => Maven Snapshot deploy.'
        type: boolean
        required: true
      publish-java-version:
        description: 'JDK used for the publish step.'
        type: string
        default: '21'
      extra-gradle-tasks:
        description: 'Additional Gradle tasks run in the same build invocation, before the release task (e.g. bndrun exports).'
        type: string
        default: ''
      artifact-paths:
        description: 'When set, upload these paths as workflow artifact "release-jars" for downstream jobs.'
        type: string
        default: ''
      gradle-parallel:
        description: 'Run Gradle with org.gradle.parallel. bnd workspaces with resolve/export tasks may need false.'
        type: boolean
        default: true
    secrets:
      CENTRAL_SONATYPE_TOKEN_USERNAME:
        required: true
      CENTRAL_SONATYPE_TOKEN_PASSWORD:
        required: true
      GPG_PASSPHRASE:
        required: true
      GPG_KEY_ID:
        required: true
      GPG_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8
  GRADLE_OPTS: >-
    -Dorg.gradle.parallel=${{ inputs.gradle-parallel }}

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Gradle Release (Java ${{ inputs.publish-java-version }}, do-release=${{ inputs.do-release }})
    runs-on: ubuntu-latest
    env:
      CS_USERNAME: ${{ secrets.CENTRAL_SONATYPE_TOKEN_USERNAME }}
      CS_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      DO_RELEASE: ${{ inputs.do-release }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          cache: "gradle"
          java-version: ${{ inputs.publish-java-version }}
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Gradle version
        run: ./gradlew --no-daemon --version
      - name: Setup GPG and jp environment
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg2 jp
          echo "$GPG_PRIVATE_KEY" > private.key
          echo "$GPG_PASSPHRASE" | gpg --batch --passphrase-fd 0 --pinentry-mode loopback --no-tty --quiet --yes --import private.key
          rm private.key
      - name: Build and Release
        env:
          # Passed via env (not inline expression) so the input never gets
          # interpolated into the shell script; word splitting is intended.
          EXTRA_GRADLE_TASKS: ${{ inputs.extra-gradle-tasks }}
        # One Gradle invocation: the jars that are tested, exported (extra tasks)
        # and released all come from the same build. Extra tasks are ordered
        # before release so a failing export aborts before anything is published.
        run: ./gradlew build testOSGi $EXTRA_GRADLE_TASKS release --stacktrace --info
      - name: Upload Release Artifacts
        if: inputs.artifact-paths != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jars
          path: ${{ inputs.artifact-paths }}
          if-no-files-found: error
      - name: Publish Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-release-java-${{ inputs.publish-java-version }}
          path: |
            **/build/test-results/**/TEST-*.xml
            **/generated/test-reports/**/TEST-*.xml
      - name: Delete GPG key from keyring
        if: always()
        run: rm -rf ~/.gnupg
