name: Reusable Docs

# VitePress build + GitHub Pages deploy. The repo-specific publish path slug comes from
# each repo's docs-site/config.mts (via DOCS_BRANCH), not from this workflow.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so VitePress `lastUpdated` git timestamps are accurate.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Check out the shared docs theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # job_workflow_sha is the commit of THIS reusable workflow, so the
          # theme is always taken from the same version the caller pinned.
          repository: eclipse-fennec/.github
          ref: ${{ github.job_workflow_sha }}
          path: .fennec-shared
          persist-credentials: false
      - name: Verify the docs theme matches the shared source
        env:
          SHARED: .fennec-shared/docs-theme
        run: |
          drift=0
          while IFS= read -r src; do
            rel=${src#"$SHARED/"}
            case $rel in
              public/*) target=docs-site/docs/public/${rel#public/} ;;
              *)        target=docs-site/docs/.vitepress/theme/$rel ;;
            esac
            if ! cmp -s "$src" "$target"; then
              echo "::error file=$target::does not match docs-theme/$rel in eclipse-fennec/.github"
              drift=1
            fi
          done < <(find "$SHARED" -type f | sort)
          [ "$drift" -eq 0 ] && exit 0
          {
            echo
            echo "The docs theme in this repository has drifted from the shared source."
            echo "It is owned by eclipse-fennec/.github (docs-theme/) so that the Eclipse"
            echo "Foundation footer and the brand palette stay identical across all project"
            echo "sites. Resync with:"
            echo
            echo "  git clone --depth 1 https://github.com/eclipse-fennec/.github /tmp/fennec-github"
            echo "  cp /tmp/fennec-github/docs-theme/index.ts \\"
            echo "     /tmp/fennec-github/docs-theme/custom.css \\"
            echo "     /tmp/fennec-github/docs-theme/EclipseFooter.vue \\"
            echo "     docs-site/docs/.vitepress/theme/"
            echo "  cp /tmp/fennec-github/docs-theme/public/*.svg docs-site/docs/public/"
            echo
            echo "Intended theme changes go into eclipse-fennec/.github first, then get"
            echo "synced here - not the other way round."
          } >&2
          exit 1
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build docs
        working-directory: docs-site
        env:
          DOCS_BRANCH: ${{ github.ref_name }}
        run: npm run docs:build
      - name: Assemble site slice
        run: |
          mkdir -p site/${{ github.ref_name }}
          cp -r docs-site/docs/.vitepress/dist/. site/${{ github.ref_name }}/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./%s/">\n' "${{ github.ref_name }}" > site/index.html
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
