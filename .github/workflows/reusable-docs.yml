name: Reusable Docs

# VitePress build + GitHub Pages deploy. The repo-specific publish path slug comes from
# each repo's docs-site/config.mts (via DOCS_BRANCH), not from this workflow.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
      version:
        description: >-
          URL segment to publish under. Defaults to the triggering ref name, which is
          what a repo publishing one channel per branch wants. Pass it explicitly when
          the branch name is not the segment - e.g. a release workflow on `main` that
          publishes `latest`.
        type: string
        default: ''
      deploy:
        description: >-
          Publish to GitHub Pages. Set false to only build and upload the slice as a
          plain artifact, for a repo that merges several Pages slices in its own
          orchestrator (a Pages deploy replaces the entire site, so a repo publishing
          more than the docs cannot let this workflow deploy).
        type: boolean
        default: true
      slice-artifact:
        description: "Artifact name for the built slice when `deploy` is false."
        type: string
        default: pages-docs

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so VitePress `lastUpdated` git timestamps are accurate.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Check out the shared docs theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # job_workflow_sha is the commit of THIS reusable workflow, so the
          # theme is always taken from the same version the caller pinned.
          repository: eclipse-fennec/.github
          ref: ${{ github.job_workflow_sha }}
          path: .fennec-shared
          persist-credentials: false
      - name: Verify the docs theme matches the shared source
        env:
          SHARED: .fennec-shared/docs-theme
        run: |
          drift=0
          while IFS= read -r src; do
            rel=${src#"$SHARED/"}
            case $rel in
              public/*) target=docs-site/docs/public/${rel#public/} ;;
              *)        target=docs-site/docs/.vitepress/theme/$rel ;;
            esac
            if ! cmp -s "$src" "$target"; then
              echo "::error file=$target::does not match docs-theme/$rel in eclipse-fennec/.github"
              drift=1
            fi
          done < <(find "$SHARED" -type f | sort)
          [ "$drift" -eq 0 ] && exit 0
          {
            echo
            echo "The docs theme in this repository has drifted from the shared source."
            echo "It is owned by eclipse-fennec/.github (docs-theme/) so that the Eclipse"
            echo "Foundation footer and the brand palette stay identical across all project"
            echo "sites. Resync with:"
            echo
            echo "  git clone --depth 1 https://github.com/eclipse-fennec/.github /tmp/fennec-github"
            echo "  cp /tmp/fennec-github/docs-theme/index.ts \\"
            echo "     /tmp/fennec-github/docs-theme/custom.css \\"
            echo "     /tmp/fennec-github/docs-theme/EclipseFooter.vue \\"
            echo "     docs-site/docs/.vitepress/theme/"
            echo "  cp /tmp/fennec-github/docs-theme/public/*.svg docs-site/docs/public/"
            echo
            echo "Intended theme changes go into eclipse-fennec/.github first, then get"
            echo "synced here - not the other way round."
          } >&2
          exit 1
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build docs
        working-directory: docs-site
        env:
          DOCS_BRANCH: ${{ inputs.version || github.ref_name }}
        run: npm run docs:build
      - name: Assemble site slice
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          # A slice is merged by the caller's own deploy job, which owns the root
          # redirect: with more than one channel published, the root has to point
          # somewhere deterministic instead of at whichever slice ran last.
          IS_FULL_SITE: ${{ inputs.deploy }}
        run: |
          mkdir -p "site/$VERSION"
          cp -r docs-site/docs/.vitepress/dist/. "site/$VERSION/"
          touch site/.nojekyll
          if [ "$IS_FULL_SITE" = "true" ]; then
            printf '<!doctype html><meta http-equiv="refresh" content="0; url=./%s/">\n' "$VERSION" > site/index.html
          fi
      - name: Upload Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Upload docs slice
        if: ${{ !inputs.deploy }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.slice-artifact }}
          path: site
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # The ONE place the Pages concurrency group is declared. A caller must not
    # declare `group: pages` at workflow level as well: its run would then hold
    # the group this job waits for, and GitHub cancels the job before its first
    # step (#35). Callers that need their own serialisation use another group.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
